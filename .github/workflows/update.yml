name: Update Phá Làng TV M3U Playlist

on:
  schedule:
    # Chạy tự động mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub UI

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script Fetch Matches
        run: python generate_m3u.py

      - name: Commit and Push M3U Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add phalang.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Phá Làng TV playlist [skip ci]" && git push)
          
