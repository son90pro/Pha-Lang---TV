name: Update Phá Làng TV M3U Playlist

on:
  schedule:
    # Chạy tự động mỗi 30 phút
    - cron: '*/30 * * * *'
  workflow_dispatch: # Nút bấm chạy thủ công trên GitHub UI

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script Fetch Matches
        run: python generate_m3u.py

      - name: Commit and Push M3U Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add phalang.m3u
          
          # Kiểm tra nếu file phalang.m3u có thay đổi thì mới commit và push
          if ! git diff --staged --quiet; then
            git commit -m "Auto update Phá Làng TV playlist [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Không có thay đổi nào trong file phalang.m3u"
          fi
          
