name: Auto Update M3U Playlist

on:
  schedule:
    # Chạy tự động mỗi 15 phút một lần
    - cron: '*/15 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script to generate M3U
        run: python generate_m3u.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add phalang.m3u
          git diff-index --quiet HEAD || git commit -m "Auto-update IPTV playlist [skip ci]"
          git push
