name: Auto Scrape Phá Làng TV Playlist

on:
  schedule:
    # Tự động chạy mỗi 1 tiếng/lần để cập nhật danh sách trận đấu & link stream
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub Actions

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push playlist.m3u
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated playlist.m3u [skip ci]" && git push)
          
